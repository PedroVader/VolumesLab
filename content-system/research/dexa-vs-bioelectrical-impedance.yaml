  - "The correct product page for a future call to action"
  - "Final byline, reviewer, domain, and canonical URL"
must_not_claim:
  - "That Volumes Lab currently offers a DEXA body composition scan"
  - "That DXA is perfectly accurate"
  - "That all BIA devices are inaccurate"
  - "That either method diagnoses a condition or determines a treatment"
volatile_facts_to_recheck:
