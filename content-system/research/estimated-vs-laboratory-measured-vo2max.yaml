claims:
  verified_facts:
    - "Wearable devices can estimate VO2max from sensor data and user inputs without directly measuring respiratory gases"
    - "Laboratory CPET measures oxygen uptake and carbon-dioxide output from respiratory gas exchange during a controlled exercise protocol"
    - "Validation performance varies across devices, protocols, populations, and individuals"
  external_observations: []
  editorial_inferences:
    - "The most useful comparison is methodological: what each result is based on and under what conditions it was obtained"
  firsthand_evidence:
    - "src/data/catalog.ts confirms that Volumes Lab lists a VO2Max Test with a graded treadmill or bike protocol"
  recommendations: []

conflicts:
  - "The catalogue lists the VO2max protocol but does not confirm the exact analyser, mask, calibration standard, or reporting fields"
unknowns:
  - "Exact Volumes Lab equipment and breath-analysis protocol"
  - "Final byline and qualified reviewer"
  - "Final production domain and canonical URL"
must_not_claim:
  - "That every wearable is inaccurate"
  - "That a laboratory value is infallible"
  - "That the test diagnoses disease or predicts an individual's outcome"
  - "That Volumes Lab uses a specific analyser or protocol not confirmed by the client"
volatile_facts_to_recheck:
  - "Current device feature names and supported activity types"

